<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BimmerzBox</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    background: #0b1020;
    color: #e2e8f0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .stripe {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    height: 4px;
  }
  .stripe i { display: block; flex: 1; }
  .stripe i:nth-child(1) { background: #1c69d4; }
  .stripe i:nth-child(2) { background: #002664; }
  .stripe i:nth-child(3) { background: #c41e3a; }

  h1 {
    margin: 0 0 12px;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand-grad {
    background: linear-gradient(90deg,#1c69d4 0%, #002664 50%, #c41e3a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-box {
    font-size: 18px;
    font-weight: 600;
    color: #94a3b8;
  }
  p {
    margin: 0 0 32px;
    max-width: 360px;
    line-height: 1.5;
    color: #94a3b8;
    font-size: 16px;
  }
  .continue {
    display: inline-block;
    padding: 16px 40px;
    background: #c41e3a;
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .15s ease;
  }
  .continue:hover { box-shadow: 0 8px 24px -8px rgba(196,30,58,.6); }
  .continue:active { transform: scale(0.97); }
  small {
    display: block;
    margin-top: 28px;
    color: #64748b;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", monospace;
  }
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>

<h1><span class="brand-grad">bimmerz</span><span class="brand-box">box</span></h1>
<p>You're connected to the dongle. Tap Continue to open the dashboard in your browser.</p>

<a id="go" class="continue" href="http://172.16.7.1/" target="_blank" rel="noopener noreferrer">Continue</a>

<small>You can close this window once the browser opens.</small>

<script>
(function () {
  var btn = document.getElementById('go');
  btn.addEventListener('click', function () {
    // Tell the dongle the user accepted — subsequent captive-portal
    // probes will return "online" so the OS dismisses this sheet.
    // `keepalive` lets the request survive the navigation that opens
    // the dashboard in the system browser.
    try {
      fetch('/captive/accept', { method: 'POST', keepalive: true });
    } catch (e) { /* ignore — link still opens */ }
  });
})();
</script>
</body>
</html>
